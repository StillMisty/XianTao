[versions]
springBoot = "4.1.1"
springAi = "2.0.1"
simbot = "5.0.0-Preview5"
ktor = "3.5.2"
mybatisFlex = "1.11.8"
lombok = "1.18.46"
jspecify = "1.0.1"
spotless = "8.10.0"
errorpronePlugin = "4.4.0"
errorproneCore = "2.50.0"
nullaway = "0.14.0"
versionCatalogUpdate = "1.1.1"

[libraries]
# Spring Boot 库（统一由 springBoot 版本驱动）
aspectj-weaver = { group = "org.aspectj", name = "aspectjweaver" }
spring-boot-starter-cache = { group = "org.springframework.boot", name = "spring-boot-starter-cache", version.ref = "springBoot" }
spring-boot-starter-flyway = { group = "org.springframework.boot", name = "spring-boot-starter-flyway", version.ref = "springBoot" }
spring-boot-starter-webmvc = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc", version.ref = "springBoot" }
spring-boot-devtools = { group = "org.springframework.boot", name = "spring-boot-devtools", version.ref = "springBoot" }
spring-boot-starter-cache-test = { group = "org.springframework.boot", name = "spring-boot-starter-cache-test", version.ref = "springBoot" }
spring-boot-starter-flyway-test = { group = "org.springframework.boot", name = "spring-boot-starter-flyway-test", version.ref = "springBoot" }
spring-boot-starter-webmvc-test = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc-test", version.ref = "springBoot" }

# MyBatis Flex 库
mybatis-flex-spring-boot4-starter = { group = "com.mybatis-flex", name = "mybatis-flex-spring-boot4-starter", version.ref = "mybatisFlex" }
mybatis-flex-processor = { group = "com.mybatis-flex", name = "mybatis-flex-processor", version.ref = "mybatisFlex" }

flyway-database-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql" }
postgresql = { group = "org.postgresql", name = "postgresql" }
caffeine = { group = "com.github.ben-manes.caffeine", name = "caffeine" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

# Lombok 库
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }

# Spring AI 库
spring-ai-starter-model-deepseek = { group = "org.springframework.ai", name = "spring-ai-starter-model-deepseek", version.ref = "springAi" }
spring-ai-starter-model-openai = { group = "org.springframework.ai", name = "spring-ai-starter-model-openai", version.ref = "springAi" }

# SimBot 库
simbot-core-spring-boot-starter = { group = "love.forte.simbot", name = "simbot-core-spring-boot-starter", version.ref = "simbot" }
simbot-component-qq-guild-core = { group = "love.forte.simbot.component", name = "simbot-component-qq-guild-core", version.ref = "simbot" }

# Ktor 客户端库
ktor-client-java = { group = "io.ktor", name = "ktor-client-java", version.ref = "ktor" }

# NullAway / JSpecify
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
errorprone-core = { group = "com.google.errorprone", name = "error_prone_core", version.ref = "errorproneCore" }
nullaway = { group = "com.uber.nullaway", name = "nullaway", version.ref = "nullaway" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorpronePlugin" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "versionCatalogUpdate" }
