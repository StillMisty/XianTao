spring:
  profiles:
    active: local
  application:
    name: XianTao
    version: 0.0.1
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xiantao}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    connection-fetch: lazy
    # HikariCP 连接池配置
    hikari:
      # LLM 调用不占连接，实际 SQL 并发有限；过大连接池 + 过短获取超时高峰易抛异常
      maximum-pool-size: 25
      max-lifetime: 1800000
      connection-timeout: 10000
      pool-name: XianTaoHikariCP

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  ai:
    deepseek:
      # 缺失时启动即失败（SpringAiConfig @Value 无默认值），避免带假 key 打满重试
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # OpenAI 兼容模型连接配置（降级后备）
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:}

# XianTao AI 分级配置
xiantao:
  # QQ 机器人接入（详见 qq-gateway 模块）
  qq:
    enabled: ${QQ_BOT_ENABLED:true}
    app-id: ${QQ_APP_ID:}
    client-secret: ${QQ_CLIENT_SECRET:}
    # 仅 ws-token-mode=APP_TICKET 时需要
    app-token: ${QQ_APP_TOKEN:}
    # websocket：长连接（默认，零部署变化）；webhook：HTTPS 回调（需要公网地址与 80/443/8080/8443 端口）
    transport: ${QQ_TRANSPORT:websocket}
    webhook-path: ${QQ_WEBHOOK_PATH:/qq/webhook}
    # Webhook 事件新鲜度窗口（防重放），0s 关闭
    webhook-max-event-age: ${QQ_WEBHOOK_MAX_EVENT_AGE:5m}
    # 选择事件是否附带按钮（点击即发送「选 X」，文本选项仍保留作兜底）
    choice-buttons: ${QQ_CHOICE_BUTTONS:true}
    # 下一步建议按钮（如地图下方推荐可前往的地区），点击即发送对应指令
    suggestion-buttons: ${QQ_SUGGESTION_BUTTONS:true}
    sandbox: ${QQ_SANDBOX:false}
    # 事件订阅位标记，默认 GROUP_AND_C2C_EVENT (1<<25)
    intents: ${QQ_INTENTS:33554432}
  ai:
    # 决定实例化哪些 Model 以及调用时的尝试顺序（列表靠前的优先）
    chat-models: [deepseek, openai]
    # 三级模型配置：heavy（重度任务）、standard（常规任务）、light（轻量任务）
    tiers:
      heavy:
        deepseek: ${XIANTAO_AI_HEAVY_DEEPSEEK:deepseek-v4-pro}
        openai: ${XIANTAO_AI_HEAVY_OPENAI:gpt-4o}
      standard:
        deepseek: ${XIANTAO_AI_STANDARD_DEEPSEEK:deepseek-v4-flash}
        openai: ${XIANTAO_AI_STANDARD_OPENAI:gpt-4o-mini}
      light:
        deepseek: ${XIANTAO_AI_LIGHT_DEEPSEEK:deepseek-v4-flash}
        openai: ${XIANTAO_AI_LIGHT_OPENAI:gpt-4o-mini}

# MyBatis-Flex 配置
mybatis-flex:
  mapper-locations: classpath*:/mappers/**/*.xml
  type-aliases-package: top.stillmisty.xiantao.domain
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志配置
logging:
  level:
    # MyBatis-Flex SQL 日志
    top.stillmisty.xiantao.infrastructure.mapper: DEBUG
